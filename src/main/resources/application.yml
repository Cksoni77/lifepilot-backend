spring:
  application:
    name: lifepilot-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3.5:4b}
    connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:3}
    response-timeout-seconds: ${OLLAMA_RESPONSE_TIMEOUT_SECONDS:120}
  recommendations:
    priority-weight: ${RECOMMENDATION_PRIORITY_WEIGHT:0.30}
    urgency-weight: ${RECOMMENDATION_URGENCY_WEIGHT:0.30}
    deadline-weight: ${RECOMMENDATION_DEADLINE_WEIGHT:0.20}
    goal-relevance-weight: ${RECOMMENDATION_GOAL_RELEVANCE_WEIGHT:0.20}
  priority-scoring:
    urgency-weight: ${PRIORITY_URGENCY_WEIGHT:0.30}
    importance-weight: ${PRIORITY_IMPORTANCE_WEIGHT:0.30}
    deadline-weight: ${PRIORITY_DEADLINE_WEIGHT:0.25}
    consequence-weight: ${PRIORITY_CONSEQUENCE_WEIGHT:0.15}
